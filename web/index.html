<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <!-- 同源入口直接提供当前部署的图标，首屏无需等待应用或外观 JSON。 -->
        <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/api/public/appearance/icon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/api/public/appearance/icon/apple-touch-icon.png" />
        <title>正在加载</title>
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            html,
            body {
                margin: 0;
                background: #0f0f11;
            }
            html.light-boot,
            html.light-boot body {
                background: #ffffff;
            }
            /* 桌面端整体 90% 显示；与 src/styles/ui-scale.css、src/lib/ui-scale.ts 一致，首屏就生效避免跳一下。 */
            @media (min-width: 1024px) {
                html:not([data-ui-scale-off]) {
                    zoom: 0.9;
                }
            }
            #root:empty {
                min-height: 100vh;
            }
            #root:empty::before {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 12px;
                height: 12px;
                margin: -6px 0 0 -6px;
                background: rgba(255, 255, 255, 0.84);
                border-radius: 999px;
                box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.08);
                animation: appearance-bootstrap-pulse 1.8s ease-in-out infinite;
            }
            #root:empty::after {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 82px;
                height: 82px;
                margin: -42px 0 0 -42px;
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-right-color: transparent;
                border-radius: 999px;
                animation: appearance-bootstrap-orbit 2.8s linear infinite;
            }
            @keyframes appearance-bootstrap-pulse { 0%, 100% { opacity: .62; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.08); } }
            @keyframes appearance-bootstrap-orbit { to { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::before,
                #root:empty::after {
                    animation: none;
                }
            }
        </style>
        <script>
            try {
                // 默认深色；只有 v1 起用户自己选过浅色才用浅色（规则同 stores/use-theme-store.ts）。
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.version >= 1 && s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.classList.toggle("light-boot", t === "light");
                document.documentElement.style.colorScheme = t;
            } catch (e) {
                document.documentElement.classList.add("dark");
            }
            try {
                // 画布编辑器、分享画布、开发实验页不参与整体缩放（规则同 src/lib/ui-scale.ts）。
                var p = location.pathname;
                if (/^\/canvas\/[^/]+/.test(p) || p.indexOf("/share/canvas/") === 0 || p.indexOf("/dev/") === 0) {
                    document.documentElement.setAttribute("data-ui-scale-off", "");
                }
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
